<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NutriChat · 中餐营养估算</title>
<style>
:root{font-family:system-ui,sans-serif;color:#173c32;background:#f3f6ef}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:32px auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:36px;margin-bottom:8px}h2{font-size:22px}p{line-height:1.7}.muted,small{color:#587268}.card{background:#fff;border:1px solid #dbe5dc;border-radius:18px;padding:24px;margin-top:20px}label{display:block;font-weight:600;margin:12px 0 8px}textarea,input,select{font:inherit;padding:12px;border:1px solid #b8cbbb;border-radius:9px;max-width:100%;background:white;color:#173c32}textarea{width:100%;min-height:100px;resize:vertical}select{width:100%}input[type=number]{width:150px}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}button{background:#246149;color:white;border:0;padding:12px 18px;border-radius:9px;font:inherit;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#edf3eb;color:#245740}button:disabled{opacity:.45;cursor:default}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#f3f6ef;padding:16px;border-radius:12px}.metric b{display:block;font-size:26px}.metric span{font-size:13px}.question{border-top:1px solid #e0e7df;padding:12px 0}.ingredient{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0}.bubble{white-space:pre-wrap;padding:14px 18px;border-radius:12px;background:#f0f5ed;margin:12px 0;overflow-wrap:anywhere}.bubble.user{background:#e2eee8;margin-left:35px}.bubble strong{display:block;font-size:12px;margin-bottom:8px}.error{color:#a12c20!important}#message{white-space:pre-wrap}.tag{font-size:13px;color:#287257}.sources{font-size:12px;overflow-wrap:anywhere}a{color:#246149}details{margin:12px 0}summary{cursor:pointer;font-weight:600}[hidden]{display:none!important}@media(max-width:550px){main{margin:8px auto;padding:14px}.card{padding:18px}.metrics{grid-template-columns:1fr 1fr}h1{font-size:28px}.ingredient input{width:100px}}

header{gap:16px;flex-wrap:wrap}.header-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.header-actions form{margin:0}.header-actions button{margin:0}.language-switch{display:inline-flex;border:1px solid #b8cbbb;border-radius:10px;padding:3px;gap:3px;background:#fff}.language-switch button{background:transparent;color:#245740;padding:8px 12px;font-size:14px;border-radius:7px}.language-switch button[aria-pressed="true"]{background:#246149;color:#fff}.language-switch button:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #4c9473;outline-offset:3px}.history-note{font-size:13px}.ingredient label{overflow-wrap:anywhere}.ingredient input{flex-shrink:0}#catalogue-info{display:inline-block;line-height:1.6}@media(max-width:550px){header{align-items:flex-start}.header-actions{gap:8px}.header-actions form button{padding:9px 12px;font-size:14px}.language-switch button{padding:8px 10px}.ingredient{align-items:flex-start}.metrics .metric{padding:13px}.metric b{font-size:24px}}
</style>
<script defer src="/app-assets/catalogue-en.js"></script>
<script defer src="/app-assets/i18n.js"></script>
<script defer src="/app-assets/app.js"></script>
</head><body><main>
<header><strong>◉ NutriChat</strong><div class="header-actions">
<div class="language-switch" role="group" aria-label="界面语言" data-i18n-label="language">
<button id="language-zh" type="button" lang="zh-CN" aria-pressed="true">中文</button>
<button id="language-en" type="button" lang="en" aria-pressed="false">English</button>
</div>
<form action="/logout" method="post"><button class="secondary" data-i18n="logout">退出登录</button></form>
</div></header>
<h1 data-i18n="heading">说说这餐吃了什么</h1>
<p class="muted" data-i18n="introduction">基础版快速了解大概热量；进阶版补充份量、做法和配方，细化营养估算。</p>
<section class="card"><label for="mode" data-i18n="chooseMode">选择估算模式</label>
<select id="mode"><option value="basic" data-i18n="basicOption">基础版 · 快速大概估算</option><option value="advanced" data-i18n="advancedOption">进阶版 · 补充细节精算</option></select>
<p class="muted" id="mode-help">按已有信息估算；缺少份量和配方时使用明确标注的参考值。</p>
<button id="switch-mode" class="secondary" type="button" hidden>切换到进阶版补充细节</button>
<form id="meal-form"><label for="meal" data-i18n="mealLabel">餐食描述</label>
<textarea id="meal" required maxlength="2000" data-i18n-placeholder="mealPlaceholder" placeholder="例如：番茄炒蛋200克，少油，配150克熟米饭。"></textarea>
<button id="estimate" data-i18n="estimate">开始估算</button><button id="new" type="button" class="secondary" data-i18n="newMeal" hidden>新的一餐</button>
<small id="catalogue-info"></small></form>
<details><summary data-i18n="supportedFoods">查看支持的食材和菜谱</summary><input id="search" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-label="searchLabel" placeholder="搜索食物／菜名" aria-label="搜索食物"><div id="food-list"></div></details></section>
<p id="message" role="status" aria-live="polite"></p>
<section class="card" id="dialogue" hidden><h2 id="dialogue-title">餐食对话</h2>
<details id="history-panel"><summary data-i18n="history">查看本餐对话记录</summary><p class="muted history-note" data-i18n="originalHistory">你输入的描述及模型自由文本保留原文。</p><div id="history"></div></details>
<form id="answer-form" hidden><div id="questions"></div><button id="answer-submit" data-i18n="answerSubmit">提交回答</button><small data-i18n="answerHelp">可以先回答已知的问题。不知道用量时，请在下方说明。</small></form>
<form id="reply-form" hidden><label for="reply" data-i18n="replyLabel">继续对话／补充或更正</label><textarea id="reply" maxlength="2000" required data-i18n-placeholder="replyPlaceholder" placeholder="例如：其实是煎蛋，150克是熟重；我这一份额外用了5克油。"></textarea><button id="reply-submit" data-i18n="replySubmit">发送补充说明</button></form></section>
<section class="card" id="result" hidden><span class="tag" id="status"></span><h2 data-i18n="resultHeading">本餐营养估算</h2><p id="interpreted"></p>
<div class="metrics"><div class="metric"><b id="calories">—</b><span data-i18n="calories">热量 · kcal</span></div><div class="metric"><b id="protein_g">—</b><span data-i18n="protein">蛋白质 · g</span></div><div class="metric"><b id="fat_g">—</b><span data-i18n="fat">脂肪 · g</span></div><div class="metric"><b id="carbs_g">—</b><span data-i18n="carbs">碳水 · g</span></div></div>
<div id="evidence"></div><p class="muted" id="review-help">请核对食用重量、做法、用油及配方。需要修改时，在上方继续对话。</p><button id="confirm" data-i18n="confirm">确认并保存</button><p><small id="record"></small></p></section>
<p><small data-i18n="disclaimer">参考估算会受到原料、烹调失水及实际摄入油量影响。生重与熟重不自动互换；菜谱默认用量须经你确认。所有重量均指可食部分。</small></p>
</main></body></html>
