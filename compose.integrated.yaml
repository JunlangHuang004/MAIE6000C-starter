# Merged application preview. Use a unique project name to isolate its database.
# Only the AI service receives a private model configuration.
x-integrated: &integrated
  env_file: !override
    - .env.example
  environment:
    NUTRITION_PROVIDER: ${NUTRITION_PROVIDER:-demo}
    LLM_PROVIDER: ${LLM_PROVIDER:-}
    WORKER_REQUEST_TIMEOUT_SECONDS: ${WORKER_REQUEST_TIMEOUT_SECONDS:-210}
    AUTH_COOKIE_SECURE: 'false'
    AUTH_PUBLIC_ORIGIN: http://localhost:${NUTRICHAT_PORT:-8005}
    AUTH_REGISTRATION_ENABLED: 'true'

services:
  db:
    ports: !reset []
  ai:
    <<: *integrated
    env_file: !override
      - .env.example
      - path: ${NUTRICHAT_MODEL_ENV_FILE:-.env}
        required: false
    ports: !reset []
  api:
    <<: *integrated
    ports: !override
      - '127.0.0.1:${NUTRICHAT_PORT:-8005}:8000'
  worker:
    <<: *integrated
