# Dedicated, key-free TA demo. Paths are relative to the first compose file.
x-demo: &demo
  env_file: !override
    - .env.example
  environment:
    NUTRITION_PROVIDER: demo
    LLM_PROVIDER: heuristic
    LLM_API_KEY: ''
    LLM_BASE_URL: ''
    DASHSCOPE_API_KEY: ''
    QWEN_BASE_URL: ''
    AUTH_COOKIE_SECURE: 'false'
    AUTH_PUBLIC_ORIGIN: http://localhost:${NUTRICHAT_DEMO_PORT:-8006}
    AUTH_REGISTRATION_ENABLED: 'true'

services:
  db:
    ports: !reset []
  ai:
    <<: *demo
    ports: !reset []
  api:
    <<: *demo
    ports: !override
      - '127.0.0.1:${NUTRICHAT_DEMO_PORT:-8006}:8000'
  worker:
    <<: *demo
