# Add to compose.cloud.yaml after preparing deploy/public runtime files.
services:
  gateway:
    build: .
    restart: unless-stopped
    command: uvicorn services.gateway.main:from_environment --factory --host 0.0.0.0 --port 8200
    env_file:
      - ./deploy/public/auth.env
    healthcheck:
      test: [CMD, python, '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8200/health/live')"]
      interval: 10s
      retries: 10
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/public/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/public/acme:/var/www/acme:ro
      - ./deploy/public/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      gateway:
        condition: service_healthy
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
